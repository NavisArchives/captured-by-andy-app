name = "capturedbyandy"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_ME"
database_id = "REPLACE_ME"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "REPLACE_ME"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
